[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "withplus-tax-calc"
version = "0.1.0"
description = "세무법인 위드플러스 세금계산기 MCP — korean-tax-calc-mcp(Upstage, MIT) 기반 운영 래퍼"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "korean-tax-calc-mcp",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
withplus-tax-calc = "withplus_tax.server:main"

# 원본 엔진은 이 저장소 상위 폴더(업스테이지 원본 코드)를 그대로 사용한다.
# 원본 파일은 수정하지 않으므로 GitHub "Sync fork"로 업데이트해도 충돌이 나지 않는다.
[tool.uv.sources]
korean-tax-calc-mcp = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["withplus_tax"]
